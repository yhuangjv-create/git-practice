[project]
name = "mouse-keyboard-recorder"
version = "1.0.0"
description = "鼠标键盘活动记录重复器（Clara 出品）— 零第三方依赖的 Windows 输入录制/回放工具"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mkr = "mkr.app:main"

[tool.setuptools.packages.find]
include = ["mkr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4"]

